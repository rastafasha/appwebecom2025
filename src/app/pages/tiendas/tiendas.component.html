<app-header></app-header>
<app-loading *ngIf="isLoading"></app-loading>
<div class="shop-layout-1" id="page" *ngIf="!isLoading">

    <section class="sub-header shop-layout-1">
        <!-- <img class="rellax bg-overlay" src="./assets/images/sub-header/01.jpg" alt=""> -->
        <div class="overlay-call-to-action"></div>
        <h3 class="heading-style-3">Stores</h3>
    </section>

    <div class="container">
	<div class="row" *ngIf="!isLoading">
		<div class="col-lg-3 col-sm-6"*ngFor="let tienda of tiendas " >

            <div class="card hovercard" >
                <div class="cardheader" [style.background-image]="'url(' + tienda.img + ')' | imagenPipe: 'tiendas'">
                </div>
                <div class="avatar">
                    <img [src]="tienda.img| imagenPipe: 'tiendas'" alt="{{tienda.nombre}} thumbnail" />
                </div>
                <div class="info">
                    <div class="title">
                        <a  [routerLink]="['../productos/tienda/', tienda._id]">{{tienda.nombre}}</a>
                    </div>
                    <div class="desc">{{tienda.local}}</div>
                    <div class="desc">{{tienda.pais}}</div>
                    <div class="desc">{{tienda.ciudad}}</div>
                    <div class="desc">{{tienda.telefono}}</div>
                    <div class="desc">{{tienda.categoria?.nombre}}</div>
                    <div class="desc"><p [innerHTML]="tienda.direccion"></p></div>
                </div>
                <div class="bottom">
                    <a class="btn btn-primary btn-twitter btn-sm" href="https://twitter.com/webmaniac">
                        <i class="fa fa-twitter"></i>
                    </a>
                    <a class="btn btn-danger btn-sm" rel="publisher"
                       href="https://plus.google.com/+ahmshahnuralam">
                        <i class="fa fa-google-plus"></i>
                    </a>
                    <a class="btn btn-primary btn-sm" rel="publisher"
                       href="https://plus.google.com/shahnuralam">
                        <i class="fa fa-facebook"></i>
                    </a>
                    <a class="btn btn-warning btn-sm" rel="publisher" href="https://plus.google.com/shahnuralam">
                        <i class="fa fa-behance"></i>
                    </a>
                </div>
            </div>

        </div>

	</div>
</div>

</div>
<app-footer></app-footer>
