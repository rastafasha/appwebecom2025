<app-header></app-header>
<app-loading *ngIf="isLoading"></app-loading>
<div *ngIf="!page && !isLoading">
    <h1 class="text-center">No hay info</h1>
</div>
<div *ngIf="page && !isLoading">
    <section *ngIf="page.img" class="sub-header shop-detail-1" style="height: 100px; background-repeat: no-repeat; background-size: cover; filter: blur(30px);"
        [style.background-image]="'url(' + page.img + ')' | imagenPipe: 'pages'">
        <img class="rellax bg-overlay">
    </section>

    <section class="page-detail mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-8">
                    <h1>{{ page.titulo }}</h1>
                    <p class="text-muted">{{ page.createdAt | date:'mediumDate' }}</p>
                    <div class="page-content" [innerHTML]="page.descripcion"></div>
                </div>
                <div class="col-md-4">
                </div>
            </div>
        </div>
    </section>
</div>
<app-footer></app-footer>
