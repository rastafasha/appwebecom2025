<!-- slider -->


<div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel" data-interval="8000">

    
    <ol class="carousel-indicators">
        <!-- <li  *ngFor="let slider of sliders; let i = index"  [class.active]="i === currentSlide" (click)="selectSlide(i)"></li> -->
        <li  *ngFor="let slider of sliders; let i = index"  [class.active]="i === currentSlide" ></li>
    </ol>
    <div class="carousel-inner">
        <div class="carousel-item active" *ngFor="let slider of sliders ; let i=index; "
            [class.active]="i === 0">
            <div class="BannPpal" [style.background-image]="'url(' + slider.img + ')'| imagenPipe: 'sliders'" >
                    <div class="container">
                        <div class="cuadrotext {{slider.align}}">
                            <h3 class="Up {{slider?.is_activeText}} {{slider.color}}">{{slider.first_title}}</h3>
                            <p class="Up {{slider?.is_activeText}} {{slider.color}}">{{slider.subtitulo}}</p>
                            <div class="text-center">
                                <a [href]="slider.enlace" [target]="slider.target" class="btn-azul btn-lg {{slider.mostrarboton}}">+ Info</a>
                            </div>
                        </div>
                    </div>
                </div>
        </div>

    </div>
    <button class="carousel-control-prev" type="button" data-target="#carouselExampleIndicators" data-slide="prev">
        <span class="fa fa-chevron-circle-left fa-2x  text-success" aria-hidden="true"></span>
        <span class="sr-only">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-target="#carouselExampleIndicators" data-slide="next">
        <span class="fa fa-chevron-circle-right fa-2x text-success" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
    </button>
</div>
