<app-loading *ngIf="isLoading"></app-loading>
<section class="topdestinations" *ngIf="!isLoading">
    <div class="container">
        <div class="grilla">

            <ng-container *ngFor="let blog of blogs | slice:0:4; let i = index ">
                <div class="cardimagen" [ngClass]="'div' + (i + 3)"
                    [style.background-image]="'url(' + blog.img + ')' | imagenPipe: 'blogs'">

                    <a [routerLink]="['./blog/',blog.slug]">
                    <div class="info">
                            <h1>{{ blog.titulo }}</h1>
                            <!-- <p [innerHTML]="blog.descripcion"></p> -->
                            <div class="topoftop">
                                <span class="time">{{blog.createdAt | date:'mediumDate'}}</span>
                            </div>
                        </div>
                    </a>
                </div>
            </ng-container>
        </div>
    </div>
</section>
