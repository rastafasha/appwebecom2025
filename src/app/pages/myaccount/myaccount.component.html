<app-header></app-header>
<div class="about" id="page">

    <section class="sub-header d-flex justify-content-center mt-5" style="padding-top: 30px;">
        
        <div class="overlay-call-to-action"></div>
    </section>

    <app-loading *ngIf="isLoading"></app-loading>
    <section class="boxed-sm" style="height: calc(100vh - 100px); margin-top: 100px;" *ngIf="!isLoading">
        <div class="container">
            <div class="row blog-v reverse">
               <div class="col-sm-4">
                <!-- <app-aside-cuenta></app-aside-cuenta> -->
               </div>
                <div class="col-12 text-center pb-5 mb-5">
                    <h1>Hola, {{identity.first_name}}!</h1>
                    <h4>Gracias por Registrarte</h4>
                    <p>Antes de continuar la compra, favor configurar datos de envio y registro </p>



                </div>
                
            </div>
            <div class="row d-flex justify-content-center " style="gap:15px">
                 <div class="d-flex align-items-center ">
                    <div class="card" style="width:100px">
                        <div class="card-body">
                            <a [routerLink]="['/my-account/perfil', identity.uid]">
                                <i class="fa fa-user" style="color: var(--blue)"></i>
                                <p>Mis Datos</p>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="d-flex align-items-center ">
                    <div class="card" style="width:100px">
                        <div class="card-body">
                            <a [routerLink]="['/my-account/direcciones']">
                                <i class="fa fa-map-marker" style="color: var(--green)"></i>
                                <p>Direcciones</p>

                            </a>
                        </div>
                    </div>
                </div>
                <div class="d-flex align-items-center ">
                    <div class="card" style="width:100px">
                        <div class="card-body">
                            <a [routerLink]="['/my-account/ordenes']">
                                <i class="fa fa-shopping-basket" style="color: var(--orange)"></i>
                                <p>Ordenes</p>

                            </a>
                        </div>
                    </div>
                </div>
                <!-- <div class="d-flex align-items-center ">
                    <div class="card">
                        <div class="card-body">
                            <a [routerLink]="['/cart']">
                                <i class="fa fa-shopping-cart"></i>
                                <p>Mi Carrito</p>

                            </a>
                        </div>
                    </div>
                </div> -->
                <div class="d-flex align-items-center ">
                    <div class="card" style="width:100px">
                        <div class="card-body">
                            <a [routerLink]="['/my-account/favoritos']">
                                <i class="fa fa-heart-o" style="color: var(--magenta)"></i>
                                <p>Favoritos</p>

                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
<app-footer></app-footer>
