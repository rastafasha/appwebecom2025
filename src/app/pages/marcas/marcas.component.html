<app-header [style.display]="display"></app-header>
<app-loading *ngIf="isLoading"></app-loading>
<div class="shop-layout-1" id="page" >

    <section class="sub-header shop-layout-1">
        <!-- <img class="rellax bg-overlay" src="./assets/images/sub-header/01.jpg" alt=""> -->
        <div class="overlay-call-to-action"></div>
        <h1 class="heading-style-3" >Nuestras Marcas</h1>
    </section>

    <section class="box-sm" *ngIf="!isLoading">
        <div class="container">
            <div class="row main ">
                <!-- <figure class="item" *ngFor="let producto of productos |  paginate: { itemsPerPage: count, currentPage: p }"> -->
                    <figure class="item" *ngFor="let marca of marcas | slice: 0: limit">
                        <div class="marca marca-style-1">
                            <div class="img-wrapper">
                                <a [routerLink]="['../productos/marca/', marca.slug]">
                                    <img class="img-responsive" [src]="marca.img | imagenPipe: 'marcas'" alt="{{marca.nombre}} thumbnail" />
                                </a>
                            </div>
                            <figcaption class="desc text-center" [style.display]="display">
                                <h3>
                                    <a class="product-name" [routerLink]="['../productos/marca/', marca.slug]">{{marca.nombre}}</a>
                                </h3>
                            </figcaption>
                        </div>
                    </figure>
                
            </div>
        </div>
    </section>
</div>
<app-footer [style.display]="display"></app-footer>
