<!-- ============================================================== -->
<!-- Main wrapper - style you can find in pages.scss -->
<!-- ============================================================== -->
<section id="wrapper" class="login-register login-sidebar" style="background-image:url(../assets/background/login-register1.jpg);">
    <div class="login-box card">
        <div class="card-body">
            <form [formGroup]="registerForm" (ngSubmit)="crearUsuario()" autocapitalize="off" class="form-horizontal form-material" id="loginform">
                <a href="javascript:void(0)" class="text-center db">
                    <img src="../assets/svg/logo_Mallconnect_tipo2.svg" alt="Home" /><br/>
                    <!-- <img src="../assets/images/logo-text.png" alt="Home" /> -->
                </a>
                <h3 class="box-title m-t-40 m-b-0">Registrate ahora!</h3><small>Crea una Cuenta y Disfruta</small>
                <div class="form-group m-t-20">
                    <div class="col-xs-12">
                        <input class="form-control" type="text" formControlName="first_name" placeholder="Nombre">
                    </div>
                </div>
                <div class="form-group m-t-20">
                    <div class="col-xs-12">
                        <input class="form-control" type="text" formControlName="last_name" placeholder="Apellido">
                    </div>
                </div>
                <div class="form-group ">
                    <div class="col-xs-12">
                        <input class="form-control" type="text" formControlName="email" placeholder="Email">
                    </div>
                </div>
                <div class="form-group ">
                    <div class="col-xs-12">
                        <input class="form-control" type="password" formControlName="password" placeholder="Password">
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-xs-12">
                        <input class="form-control" type="password" formControlName="password2" placeholder="Confirm Password">
                    </div>
                </div>
                <div class="form-group row">
                    <div class="col-md-12">
                        <div class="checkbox checkbox-primary p-t-0">
                            <input id="checkbox-signup" formControlName="terminos" type="checkbox">
                            <label for="checkbox-signup"> Acepto todos los <a href="#">Términos y condiciones</a></label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col text-danter">
                        <p *ngIf="campoNoValido('first_name')">* El nombre es obligatorio</p>
                        <p *ngIf="campoNoValido('last_name')">* El apellido es obligatorio</p>
                        <p *ngIf="campoNoValido('email')">* El email es obligatorio y debe ser valido</p>
                        <p *ngIf="aceptaTerminos()">* Debe aceptar los términos de uso</p>
                        <p *ngIf="passwordNoValido()">* El password deben ser iguales </p>
                    </div>
                </div>

                <div class="form-group text-center m-t-20">
                    <div class="col-xs-12">
                        <button class="btn btn-info btn-lg btn-block text-uppercase waves-effect waves-light" type="submit">Registrarme</button>
                    </div>
                </div>
                <div class="form-group m-b-0">
                    <div class="col-sm-12 text-center">
                        <p>Ya tienes una Cuenta? <a routerLink="/login" class="text-info m-l-5"><b>Ingresar</b></a></p>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
<!-- ============================================================== -->
<!-- End Wrapper -->
<!-- ============================================================== -->
