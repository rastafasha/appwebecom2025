<app-header></app-header>
<div class="about" id="page">

    <section class="sub-header shop-layout-1">
        <img class="rellax bg-overlay" src="./assets/images/sub-header/08.jpg" alt="">
        <div class="overlay-call-to-action"></div>
        <h3 class="heading-style-3">My Account</h3>
    </section>
    <section class="boxed-sm" style="height: calc(100vh - 100px); margin-top: 100px;">
        <div class="container">
            <div class="row blog-v reverse">
               <div class="col-sm-4">
                <!-- <app-aside-cuenta></app-aside-cuenta> -->
               </div>
                <div class="col-md-8">
                    <h1>Hola, {{identity.first_name}}!</h1>
                    <h2>Gracias por Registrarte</h2>
                    <p>Antes de continuar la compra, favor configurar datos de envio y registro </p>



                </div>
                
            </div>
            <div class="row">
                <div class="col-xs-6 col-sm-3">
                    <div class="card">
                        <div class="card-body">
                            <a [routerLink]="['/my-account/perfil', identity.uid]">
                                <i class="fa fa-user"></i>
                                <p>Mis Datos</p>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="col-xs-6 col-sm-3">
                    <div class="card">
                        <div class="card-body">
                            <a [routerLink]="['/my-account/direcciones']">
                                <i class="fa fa-map-marker"></i>
                                <p>Direcciones</p>

                            </a>
                        </div>
                    </div>
                </div>
                <div class="col-xs-6 col-sm-3">
                    <div class="card">
                        <div class="card-body">
                            <a [routerLink]="['/my-account/ordenes']">
                                <i class="fa fa-shopping-basket"></i>
                                <p>Ordenes</p>

                            </a>
                        </div>
                    </div>
                </div>
                <div class="col-xs-6 col-sm-3">
                    <div class="card">
                        <div class="card-body">
                            <a [routerLink]="['/cart']">
                                <i class="fa fa-shopping-cart"></i>
                                <p>Mi Carrito</p>

                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
<app-footer></app-footer>
